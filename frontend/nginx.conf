server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    # API proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploads proxy — serve uploaded files from backend
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Merchant PC — SPA fallback
    location /merchant/ {
        alias /usr/share/nginx/html/merchant/;
        try_files $uri $uri/ @merchant_fallback;
    }

    location @merchant_fallback {
        root /usr/share/nginx/html;
        rewrite ^ /merchant/index.html break;
    }

    # Mobile H5 (default) — SPA fallback
    location / {
        root /usr/share/nginx/html/mobile;
        try_files $uri $uri/ /index.html;
    }
}
